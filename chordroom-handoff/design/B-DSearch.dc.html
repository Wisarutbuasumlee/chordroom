<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ค้นหาด้วย Ctrl K</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{t.dim}}; color: {{t.ink}}; font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 96px 16px 48px; gap: 16px">
  <div style="width: 100%; max-width: 720px; border-radius: 22px; background: {{t.surface}}; border: 2px solid {{t.border}}; box-shadow: 8px 8px 0 {{t.shadow}}; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; border-bottom: 2px solid {{t.border}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="pq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">ค้นหาเพลงหรือศิลปิน</label>
      <input id="pq" value="คลื่น" style="flex: 1; min-width: 0; height: 66px; border: 0; background: transparent; color: {{t.ink}}; font-family: inherit; font-size: 21px; font-weight: 500; outline: none">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; border: 2px solid {{t.border}}; border-radius: 8px; padding: 2px 8px">esc</span>
      <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; font-family: inherit; padding: 0"><sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button>
    </div>
    <div style="display: flex; gap: 8px; padding: 14px 20px 6px; flex-wrap: wrap">
      <button style="height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid {{t.border}}; background: {{t.ink}}; color: {{t.bg}}; font-family: inherit; font-weight: 600; font-size: 13px">ทุกเว็บ</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px">dochord</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px">chordzaa</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 999px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px">chordtabs</button>
    </div>
    <div style="padding: 10px; display: flex; flex-direction: column; gap: 4px">
      <div style="padding: 12px 14px; border-radius: 16px; background: {{t.soft}}; border: 2px solid {{t.primary}}; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <div style="flex: 1 1 220px; min-width: 0"><div style="font-family: 'Prompt', sans-serif; font-size: 17px; font-weight: 600">คลื่นทะเลกับเธอ</div><div style="font-size: 13px; color: {{t.muted}}">ศิลปินตัวอย่าง C</div></div>
        <div style="display: flex; gap: 6px">
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.primary}}; color: {{t.onPrimary}}; font-family: inherit; font-size: 13px; font-weight: 700">chordzaa ↵</button>
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 600">dochord</button>
        </div>
      </div>
      <div style="padding: 12px 14px; border-radius: 16px; border: 2px solid transparent; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <div style="flex: 1 1 220px; min-width: 0"><div style="font-family: 'Prompt', sans-serif; font-size: 17px; font-weight: 600">คลื่นลมในใจ</div><div style="font-size: 13px; color: {{t.muted}}">ศิลปินตัวอย่าง G</div></div>
        <div style="display: flex; gap: 6px">
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 600">dochord</button>
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 600">chordzaa</button>
          <button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 600">chordtabs</button>
        </div>
      </div>
      <div style="padding: 12px 14px; border-radius: 16px; border: 2px solid transparent; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <div style="flex: 1 1 220px; min-width: 0"><div style="font-family: 'Prompt', sans-serif; font-size: 17px; font-weight: 600">ตามคลื่นไป</div><div style="font-size: 13px; color: {{t.muted}}">ศิลปินตัวอย่าง H</div></div>
        <div style="display: flex; gap: 6px"><button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 600">chordtabs</button></div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 18px; padding: 12px 20px; border-top: 2px solid {{t.border}}; font-size: 13px; color: {{t.muted}}">
      <span><b style="font-family: 'JetBrains Mono', monospace; color: {{t.ink}}">↑ ↓</b> เลือกเพลง</span>
      <span><b style="font-family: 'JetBrains Mono', monospace; color: {{t.ink}}">← →</b> เปลี่ยนเว็บ</span>
      <span><b style="font-family: 'JetBrains Mono', monospace; color: {{t.ink}}">↵</b> เปิดให้ทั้งห้อง</span>
    </div>
  </div>
  <div style="font-size: 13px; color: {{t.ink}}; opacity: 0.8">กด Ctrl + K (บน Mac คือ ⌘ + K) เพื่อเปิดช่องนี้จากหน้าไหนก็ได้</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startDark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: !!props.startDark }; }
  renderVals() {
    const d = this.state.dark;
    const t = d
      ? { bg: '#0F1115', surface: '#191C22', soft: '#242A36', ink: '#ECEEF2', muted: '#A3A9B5', border: '#3A404C', line: '#262A33', shadow: '#000000', primary: '#6F8FFF', onPrimary: '#0B0F1A', hl: '#F2C94C', onHl: '#15130A', dim: '#000000', chrome: '#000000' }
      : { bg: '#F3F5F8', surface: '#FFFFFF', soft: '#EEF2FF', ink: '#0F1A2B', muted: '#4A5568', border: '#0F1A2B', line: '#E2E6EC', shadow: '#0F1A2B', primary: '#2D5BFF', onPrimary: '#FFFFFF', hl: '#FFD43B', onHl: '#0F1A2B', dim: '#C9D0DA', chrome: '#0F1A2B' };
    return { t: t, isDark: d, isLight: !d, toggle: () => this.setState({ dark: !d }), toggleLabel: d ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด' };
  }
}
</script>
</body>
</html>
