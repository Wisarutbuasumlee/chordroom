<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หน้าแรก มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column; padding: 48px 20px 28px; gap: 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: {{t.primary}}; color: {{t.onPrimary}}; border: 2px solid {{t.border}}; box-shadow: 3px 3px 0 {{t.shadow}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-3-3-7-8-7-12.5C5 5 8 3 12 3s7 2 7 5.5C19 13 15 18 12 21z"></path><path d="M10 14V8l4-1v5"></path></svg>
    </div>
    <div style="flex: 1; font-family: 'Prompt', sans-serif; font-size: 21px; font-weight: 700">ChordRoom</div>
    <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; font-family: inherit; padding: 0"><sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Prompt', sans-serif; font-size: 36px; line-height: 1.2; font-weight: 700">เปิดคอร์ดเพลงเดียว <span style="background: {{t.hl}}; color: {{t.onHl}}; padding: 0 8px; border-radius: 8px">ทั้งวง</span> เห็นพร้อมกัน</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6; color: {{t.muted}}">ค้นคอร์ดจาก 3 เว็บในช่องเดียว ใครเลือกเพลง ทุกคนในห้องก็เห็นทันที</p>
  </div>

  <div style="border-radius: 22px; background: {{t.surface}}; border: 2px solid {{t.border}}; box-shadow: 5px 5px 0 {{t.shadow}}; padding: 20px; display: flex; flex-direction: column; gap: 16px">
    <a href="B-Invite.dc.html" style="height: 56px; border-radius: 999px; background: {{t.primary}}; color: {{t.onPrimary}}; border: 2px solid {{t.border}}; font-family: 'Prompt', sans-serif; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      สร้างห้องใหม่
    </a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: {{t.muted}}">
      <span style="flex: 1; height: 2px; background: {{t.line}}"></span>หรือใส่รหัสห้องเพื่อน<span style="flex: 1; height: 2px; background: {{t.line}}"></span>
    </div>
    <div style="display: flex; gap: 8px">
      <label for="bc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">รหัสห้อง</label>
      <input id="bc" placeholder="KX7-42Q" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid {{t.border}}; background: {{t.bg}}; color: {{t.ink}}; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.08em">
      <a href="B-Join.dc.html" style="height: 52px; padding: 0 18px; border-radius: 14px; background: {{t.hl}}; border: 2px solid {{t.border}}; color: {{t.onHl}}; font-weight: 700; display: flex; align-items: center; text-decoration: none; box-sizing: border-box">เข้าห้อง</a>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; border: 2px solid {{t.border}}">dochord.com</span>
    <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; border: 2px solid {{t.border}}">chordzaa.com</span>
    <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{t.surface}}; border: 2px solid {{t.border}}">chordtabs.in.th</span>
  </div>

  <a href="B-Song.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 2px solid {{t.border}}; text-decoration: none; color: {{t.ink}}">
    <div style="display: flex">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #6CB4FF; color: #0F1A2B; border: 2px solid {{t.border}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">ต</span>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #FF9E7A; color: #0F1A2B; border: 2px solid {{t.border}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-left: -8px">ม</span>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #B7A3FF; color: #0F1A2B; border: 2px solid {{t.border}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-left: -8px">ป</span>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 700">ซ้อมวันเสาร์</div>
      <div style="font-size: 13px; color: {{t.muted}}">ห้องล่าสุด · 3 คนออนไลน์</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startDark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: !!props.startDark }; }
  renderVals() {
    const d = this.state.dark;
    const t = d
      ? { bg: '#0F1115', surface: '#191C22', soft: '#242A36', ink: '#ECEEF2', muted: '#A3A9B5', border: '#3A404C', line: '#262A33', shadow: '#000000', primary: '#6F8FFF', onPrimary: '#0B0F1A', hl: '#F2C94C', onHl: '#15130A', dim: '#000000', chrome: '#000000' }
      : { bg: '#F3F5F8', surface: '#FFFFFF', soft: '#EEF2FF', ink: '#0F1A2B', muted: '#4A5568', border: '#0F1A2B', line: '#E2E6EC', shadow: '#0F1A2B', primary: '#2D5BFF', onPrimary: '#FFFFFF', hl: '#FFD43B', onHl: '#0F1A2B', dim: '#C9D0DA', chrome: '#0F1A2B' };
    return { t: t, isDark: d, isLight: !d, toggle: () => this.setState({ dark: !d }), toggleLabel: d ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด' };
  }
}
</script>
</body>
</html>
