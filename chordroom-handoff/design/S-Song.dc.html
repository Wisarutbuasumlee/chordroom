<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ดูคอร์ดในหน้าเดียว มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Noto Sans Thai', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 44px 12px 10px 16px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Prompt', sans-serif; font-size: 18px; font-weight: 700">ซ้อมวันเสาร์</div>
      <div style="font-size: 12px; color: {{t.muted}}">3 คนอยู่ในห้อง</div>
    </div>
    <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; font-family: inherit; padding: 0"><sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button>
    <a href="B-Invite.dc.html" aria-label="ชวนเพื่อน" style="width: 44px; height: 44px; border-radius: 50%; background: {{t.surface}}; border: 2px solid {{t.border}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
    </a>
  </header>

  <div style="margin: 0 12px 10px; padding: 8px 8px 8px 10px; border-radius: 16px; background: {{t.hl}}; color: {{t.onHl}}; border: 2px solid {{t.border}}; display: flex; align-items: center; gap: 10px">
    <span style="width: 28px; height: 28px; border-radius: 50%; background: #6CB4FF; color: #0F1A2B; border: 2px solid #0F1A2B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">ต</span>
    <div style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.35">ต้น เปิดเพลงนี้ให้ทุกคน · เมื่อสักครู่</div>
    <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #0F1A2B; background: #FFFFFF; color: #0F1A2B; font-family: inherit; font-size: 13px; font-weight: 700">เพลงก่อน</button>
  </div>

  <div style="padding: 0 16px 10px; display: flex; align-items: center; gap: 8px">
    <div style="flex: 1; min-width: 0">
      <div style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ทะเลยามเย็น</div>
      <div style="font-size: 12px; color: {{t.muted}}">ศิลปินตัวอย่าง A · dochord.com</div>
    </div>
    <a href="https://www.dochord.com/" aria-label="เปิดในเว็บต้นทาง" style="width: 40px; height: 40px; border-radius: 12px; border: 2px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>
    </a>
  </div>

  <section aria-label="หน้าคอร์ดจากเว็บต้นทาง" style="flex: 1; min-height: 0; margin: 0 8px; border-radius: 18px 18px 0 0; border: 2px solid {{t.border}}; border-bottom: 0; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column">
    <div style="height: 30px; flex-shrink: 0; background: #F1F3F5; border-bottom: 1px solid #E1E4E8; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #57606A">dochord.com · แสดงหน้าเว็บต้นทางในกรอบนี้</div>
    <div style="padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; color: #1F2328">
      <div><div style="font-size: 18px; font-weight: 700">[ชื่อเพลงจากเว็บต้นทาง]</div><div style="font-size: 13px; color: #57606A">[ศิลปิน] · Key G</div></div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B4410C; white-space: pre">Intro:  G   D/F#   Em   C</div>
      <div style="font-size: 12px; color: #6E7781">ท่อน 1</div>
      <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B4410C; white-space: pre">G            D/F#</div><div style="height: 10px; width: 86%; border-radius: 5px; background: #E4E7EB"></div></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B4410C; white-space: pre">Em           C</div><div style="height: 10px; width: 74%; border-radius: 5px; background: #E4E7EB"></div></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B4410C; white-space: pre">Am      D       G</div><div style="height: 10px; width: 90%; border-radius: 5px; background: #E4E7EB"></div></div>
      <div style="font-size: 12px; color: #6E7781">ท่อนฮุก</div>
      <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #B4410C; white-space: pre">C       D        Bm      Em</div><div style="height: 10px; width: 92%; border-radius: 5px; background: #E4E7EB"></div></div>
    </div>
  </section>

  <nav aria-label="เมนูหลัก" style="display: flex; border-top: 2px solid {{t.border}}; background: {{t.surface}}; padding: 6px 8px 24px">
    <a href="S-Song.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.primary}}; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      เพลงตอนนี้
    </a>
    <a href="B-Search.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.muted}}; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      ค้นหา
    </a>
    <a href="B-Invite.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.muted}}; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>
      คนในห้อง
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startDark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: !!props.startDark }; }
  renderVals() {
    const d = this.state.dark;
    const t = d
      ? { bg: '#0F1115', surface: '#191C22', soft: '#242A36', ink: '#ECEEF2', muted: '#A3A9B5', border: '#3A404C', line: '#262A33', shadow: '#000000', primary: '#6F8FFF', onPrimary: '#0B0F1A', hl: '#F2C94C', onHl: '#15130A', dim: '#000000', chrome: '#000000' }
      : { bg: '#F3F5F8', surface: '#FFFFFF', soft: '#EEF2FF', ink: '#0F1A2B', muted: '#4A5568', border: '#0F1A2B', line: '#E2E6EC', shadow: '#0F1A2B', primary: '#2D5BFF', onPrimary: '#FFFFFF', hl: '#FFD43B', onHl: '#0F1A2B', dim: '#C9D0DA', chrome: '#0F1A2B' };
    return { t: t, isDark: d, isLight: !d, toggle: () => this.setState({ dark: !d }), toggleLabel: d ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด' };
  }
}
</script>
</body>
</html>
